<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: grid; place-items: center; background: #F4F6F7; color: #141A1F; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; }
        .box { max-width: 460px; background: #fff; border: 1px solid #DDE2E6; border-radius: 18px; padding: 40px 32px; text-align: center; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        p { color: #56606B; margin-bottom: 24px; }
        a { display: inline-block; background: #0E3B43; color: #fff; padding: 13px 24px; border-radius: 8px; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Something went wrong</h1>
        <p>That's on us, not you. We've been alerted. Please try again in a minute.</p>
        <a href="/">Back to the homepage</a>
    </div>
</body>
</html>
