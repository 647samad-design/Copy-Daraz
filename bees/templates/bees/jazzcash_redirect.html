<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to JazzCash...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fafafa; }
        .box { text-align: center; }
        .spinner { width: 36px; height: 36px; border: 3px solid #eee; border-top-color: #c9a24b; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #555; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <p>Redirecting you to JazzCash to complete your payment...</p>
    </div>
    <form id="jazzcash-form" method="POST" action="{{ checkout_url }}">
        {% for key, value in params.items %}
        <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endfor %}
    </form>
    <script>document.getElementById('jazzcash-form').submit();</script>
</body>
</html>
