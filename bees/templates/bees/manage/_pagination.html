{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pages" style="margin-top:8px;">
    {% if page_obj.has_previous %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
    <span class="current" aria-current="page">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">Next</a>{% endif %}
</nav>
{% endif %}
