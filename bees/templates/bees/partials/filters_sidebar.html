<aside class="filters panel panel-tight" aria-label="Filters">
    <h2>Filters</h2>
    <form method="get">
        {% if query %}<input type="hidden" name="q" value="{{ query }}">{% endif %}
        {% if current_sort %}<input type="hidden" name="sort" value="{{ current_sort }}">{% endif %}
        <div class="field">
            <span class="label">Price</span>
            <div class="price-range">
                <input class="input" type="number" name="min_price" placeholder="Min" min="0" step="0.01" value="{{ f_min_price }}" aria-label="Minimum price">
                <span class="muted">to</span>
                <input class="input" type="number" name="max_price" placeholder="Max" min="0" step="0.01" value="{{ f_max_price }}" aria-label="Maximum price">
            </div>
        </div>
        <div class="field">
            <label for="f-rating">Customer rating</label>
            <select id="f-rating" name="min_rating">
                <option value="" {% if not f_min_rating %}selected{% endif %}>Any rating</option>
                <option value="4" {% if f_min_rating == "4" %}selected{% endif %}>4 stars and up</option>
                <option value="3" {% if f_min_rating == "3" %}selected{% endif %}>3 stars and up</option>
                <option value="2" {% if f_min_rating == "2" %}selected{% endif %}>2 stars and up</option>
            </select>
        </div>
        {% if sellers %}
        <div class="field">
            <label for="f-seller">Seller</label>
            <select id="f-seller" name="seller">
                <option value="" {% if not f_seller %}selected{% endif %}>All sellers</option>
                {% for s in sellers %}<option value="{{ s }}" {% if f_seller == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
            </select>
        </div>
        {% endif %}
        <div class="field">
            <label class="check"><input type="checkbox" name="in_stock" value="1" {% if f_in_stock %}checked{% endif %}> In stock only</label>
        </div>
        <div class="field">
            <button type="submit" class="btn btn-primary btn-block">Show results</button>
            {% if f_min_price or f_max_price or f_min_rating or f_seller or f_in_stock %}
            <a href="?{% if query %}q={{ query|urlencode }}{% endif %}" class="btn btn-ghost btn-block">Clear filters</a>
            {% endif %}
        </div>
    </form>
</aside>
