<div class="sort-bar">
    <form method="get">
        {% if query %}<input type="hidden" name="q" value="{{ query }}">{% endif %}
        <select name="sort" onchange="this.form.submit()">
            <option value="" {% if not current_sort %}selected{% endif %}>{{ t.sort_default }}</option>
            <option value="price_asc" {% if current_sort == "price_asc" %}selected{% endif %}>{{ t.price_low_high }}</option>
            <option value="price_desc" {% if current_sort == "price_desc" %}selected{% endif %}>{{ t.price_high_low }}</option>
            <option value="newest" {% if current_sort == "newest" %}selected{% endif %}>{{ t.newest_first }}</option>
            <option value="rating" {% if current_sort == "rating" %}selected{% endif %}>{{ t.top_rated }}</option>
        </select>
    </form>
</div>
