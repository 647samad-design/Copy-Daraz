{% extends "bees/base.html" %}
{% block title %}{{ page_title }} — {{ brand.site_name }}{% endblock %}
{% block content %}
<div class="wrap page" style="max-width:820px;">
    <article class="panel prose">
        <h1>{{ page_title }}</h1>
        {% for heading, body in sections %}<h2>{{ heading }}</h2><p>{{ body }}</p>{% endfor %}
        {% if cta_url %}<a href="{{ cta_url }}" class="btn btn-primary" style="margin-top:28px;">{{ cta_label }}</a>{% endif %}
    </article>
</div>
{% endblock %}
