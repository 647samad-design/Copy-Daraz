{% extends "daraz/emails/_base_email.html" %}
{% block email_body %}
    <h2 style="margin:0 0 10px;color:#1c1c1c;">Verify your email</h2>
    <p style="margin:0 0 20px;color:#666;">Hi {{ user.username }}, please confirm this is your email address to finish setting up your 19Bees account.</p>
    <a href="{{ link }}" style="display:inline-block;background:#ffc93c;color:#1c1c1c;text-decoration:none;padding:11px 26px;border-radius:4px;font-weight:bold;font-size:13px;">Verify email address</a>
    <p style="margin:22px 0 0;font-size:12px;color:#999;">If you didn't create this account, you can ignore this email.</p>
{% endblock %}
