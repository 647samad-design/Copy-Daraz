<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Copy-Daraz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { background: #f5f5f5; }

        .topbar {
            background: #f85606;
            color: #fff;
            font-size: 13px;
            display: flex;
            justify-content: flex-end;
            gap: 24px;
            padding: 6px 40px;
        }
        .topbar a { color: #fff; text-decoration: none; }
        .topbar a:hover { text-decoration: underline; }

        .navbar {
            background: #f85606;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 14px 40px;
        }
        .logo {
            color: #fff;
            font-size: 26px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }
        .search-form {
            flex: 1;
            display: flex;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 2px 0 0 2px;
            font-size: 15px;
            outline: none;
        }
        .search-btn {
            background: #ffb9a3;
            border: none;
            padding: 0 20px;
            border-radius: 0 2px 2px 0;
            cursor: pointer;
            font-size: 18px;
            color: #f85606;
        }
        .cart {
            color: #fff;
            font-size: 26px;
            text-decoration: none;
        }

        .hero { margin: 20px 40px; }

        .slider {
            position: relative;
            width: 100%;
            height: 320px;
            border-radius: 8px;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }
        .slide.active { opacity: 1; }

        .dots {
            position: absolute;
            bottom: 12px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
        }
        .dot.active { background: #fff; }
    </style>
</head>
<body>

    <div class="topbar">
        <a href="#">Save more on app</a>
        <a href="#">Sell on Daraz</a>
        <a href="#">Help & Support</a>
        <a href="#">Login</a>
        <a href="#">Sign up</a>
        <a href="#">Change language</a>
    </div>

    <div class="navbar">
        <a href="{% url 'home' %}" class="logo">Copy-Daraz</a>
        <form class="search-form" action="#" method="get">
            <input class="search-input" type="text" name="q" placeholder="Search the drawer.">
            <button class="search-btn" type="submit">&#128269;</button>
        </form>
        <a href="#" class="cart">&#128722;</a>
    </div>

    <div class="hero">
        <div class="slider" id="slider">
            <img class="slide active" src="https://picsum.photos/id/1015/1200/320" alt="slide1">
            <img class="slide" src="https://picsum.photos/id/1025/1200/320" alt="slide2">
            <img class="slide" src="https://picsum.photos/id/1035/1200/320" alt="slide3">
            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        let current = 0;

        function showSlide(index) {
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            slides[index].classList.add('active');
            dots[index].classList.add('active');
        }

        function nextSlide() {
            current = (current + 1) % slides.length;
            showSlide(current);
        }

        function scheduleNext() {
            const delay = Math.floor(Math.random() * (5000 - 2000 + 1)) + 2000;
            setTimeout(() => {
                nextSlide();
                scheduleNext();
            }, delay);
        }

        scheduleNext();
    </script>
</body>
</html>
